name: Release Signed APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Test & Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Decode release keystore from GitHub Secrets
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing one or more required signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          # Align alias in the temporary runner keystore if user's alias differs from "upload"
          if [ "$ANDROID_KEY_ALIAS" != "upload" ]; then
            keytool -changealias \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              -destalias "upload" \
              -keypass "$ANDROID_KEY_PASSWORD"
          fi
          echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare release APK artifact
        id: artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          OUT_APK="${RUNNER_TEMP}/CoreGovernor-${TAG}-release.apk"
          if [ ! -f "$SRC_APK" ]; then
            echo "::error::Expected signed release APK at $SRC_APK was not produced."
            exit 1
          fi
          cp "$SRC_APK" "$OUT_APK"
          sha256sum "$OUT_APK" > "${OUT_APK}.sha256"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "sha_path=${OUT_APK}.sha256" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.jks"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.sha_path }}
